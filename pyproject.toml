[project]
name = "cattle-price"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "xgboost-cpu>=3.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
